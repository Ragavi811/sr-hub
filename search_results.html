<!DOCTYPE html>
<html>
<head>
    <title>Search Results | SR HUB</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        h2 { color: #333; margin-bottom: 20px; border-left: 5px solid #e91e63; padding-left: 15px; }
    </style>
</head>
<body>

    <h2>Search Results for: <span style="color: #e91e63;">"{{ query }}"</span></h2>

    {% if products %}
        <div class="grid">
            {% for p in products %}
            <div class="card">
                <img src="/static/images/{{ p.image_url }}">
                <h3>{{ p.name }}</h3>
                <p style="color: #e91e63; font-weight: bold;">₹{{ p.price }}</p>
                <a href="/category/{{ p.category }}" style="text-decoration: none; color: #666; font-size: 12px;">View in {{ p.category }}</a>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div style="text-align: center; margin-top: 50px;">
            <i class="fas fa-search-minus" style="font-size: 50px; color: #ccc;"></i>
            <p style="color: #666; font-size: 18px;">Oops! We couldn't find any products matching "{{ query }}".</p>
            <a href="/" style="color: #e91e63; font-weight: bold;">Back to Home</a>
        </div>
    {% endif %}

</body>
</html>
