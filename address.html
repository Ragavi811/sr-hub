<!DOCTYPE html>
<html>
<head>
    <title>SR HUB | Shipping Details</title>
    <style>
        body { margin:0; font-family: 'Segoe UI', sans-serif; background:#f4f4f4; padding: 20px; }
        
        /* Navigation Bar Style */
        .nav-bar { background: white; padding: 15px 0; display: flex; justify-content: center; gap: 30px; border-bottom: 1px solid #ddd; margin-bottom: 30px; }
        .nav-bar a { text-decoration: none; color: #333; font-weight: 600; font-size: 14px; text-transform: uppercase; }

        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        
        h2 { color: #e91e63; text-align: center; margin-bottom: 30px; letter-spacing: 1px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        
        input, textarea, select { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; 
            box-sizing: border-box; font-size: 15px; transition: 0.3s;
        }
        input:focus, textarea:focus { border-color: #e91e63; outline: none; background: #fffafa; }

        .btn-pay { 
            background: #e91e63; color: white; border: none; padding: 15px; width: 100%; 
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 20px;
        }
        .btn-pay:hover { background: #c2185b; }

        .price-summary { background: #fff0f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="/home">Home</a>
        <a href="/category/men">Men</a>
        <a href="/category/women">Women</a>
        <a href="/category/kids">Kids</a>
        <a href="/category/accessories">Accessories</a>
        <a href="/logout" style="color: #e91e63; font-weight: bold;">Logout</a>
        <a href="/cart">🛒 My Cart</a>
    </div>

    <div class="container">
        <h2>Shipping Information</h2>
        
        <div class="price-summary">
            <strong>Order Total: ₹{{ total }}</strong>
        </div>

        <form action="/place_order" method="POST">
            <div class="form-group">
                <label>Customer Full Name</label>
                <input type="text" name="customer_name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <textarea name="address" rows="4" placeholder="Door No, Street Name, Area, Pincode" required></textarea>
            </div>

            <div class="form-group">
                <label>Landmark (Optional)</label>
                <input type="text" name="landmark" placeholder="e.g. Near City Hospital">
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <select name="payment_mode" required>
                    <option value="" disabled selected>Choose payment type...</option>
                    <option value="cod">Cash on Delivery (COD)</option>
                    <option value="online">online Payment (Scan QR)</option>
                </select>
            </div>

            <button type="submit" class="btn-pay">PROCEED TO BILLING</button>
        </form>
    </div>

</body>
</html>
