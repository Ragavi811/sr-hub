<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR HUB | Welcome</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 24px;
            width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .brand-logo { color: #fff; font-size: 32px; font-weight: 800; letter-spacing: 4px; margin-bottom: 5px; }
        .brand-logo span { color: #e91e63; }
        .subtitle { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 30px; }

        .role-selection { display: flex; gap: 15px; margin-bottom: 25px; }
        .role-card { 
            flex: 1; padding: 15px; border-radius: 15px; cursor: pointer;
            transition: 0.3s; border: 2px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6);
        }
        .role-card.active { border-color: #e91e63; background: rgba(233, 30, 99, 0.2); color: white; }

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.6); }
        .input-group input {
            width: 100%; padding: 15px 15px 15px 45px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; outline: none;
        }

        .btn-login {
            width: 100%; padding: 18px; background: #e91e63; color: white; border: none;
            border-radius: 12px; font-weight: 900; font-size: 18px; cursor: pointer;
            transition: 0.3s; margin-top: 10px; letter-spacing: 2px;
        }
        .btn-login:hover { transform: scale(1.02); background: #c2185b; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="brand-logo">SR <span>HUB</span></div>
    <div class="subtitle">Experience Premium Shopping</div>

    <form action="/login" method="POST">
        <div class="role-selection">
            <div class="role-card active" id="buyer-card" onclick="setRole('buyer')">
                <i class="fas fa-shopping-bag" style="font-size: 24px; display: block; margin-bottom: 5px;"></i>
                <span style="font-size: 11px; font-weight: bold;">BUYER</span>
            </div>
            <div class="role-card" id="vendor-card" onclick="setRole('vendor')">
                <i class="fas fa-store" style="font-size: 24px; display: block; margin-bottom: 5px;"></i>
                <span style="font-size: 11px; font-weight: bold;">VENDOR</span>
            </div>
        </div>

        <input type="hidden" name="role" id="user_role" value="buyer">

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>
        
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-login">LOGIN</button>
    </form>

    <div style="display: flex; justify-content: space-between; margin-top: 25px; font-size: 13px;">
        <a href="/register" style="color: #e91e63; text-decoration: none; font-weight: bold;">
            Create Account
        </a>
        <a href="/guest_login" style="color: rgba(255,255,255,0.7); text-decoration: none; font-weight: bold;">
            Guest Access
        </a>
    </div>
</div>

<script>
function setRole(role) {
    document.getElementById('user_role').value = role;
    const bCard = document.getElementById('buyer-card');
    const vCard = document.getElementById('vendor-card');
    
    if(role === 'buyer') {
        bCard.classList.add('active');
        vCard.classList.remove('active');
    } else {
        vCard.classList.add('active');
        bCard.classList.remove('active');
    }
}
</script>

</body>
</html>
