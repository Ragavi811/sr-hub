<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SR HUB | Join Us</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80');
            background-size: cover; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 24px; width: 400px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2); color: white;
        }
        input {
            width: 100%; padding: 15px; margin: 10px 0; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; outline: none;
        }
        .btn {
            width: 100%; padding: 18px; background: #e91e63; color: white; border: none;
            border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 10px;">Create Account</h2>
        <p style="color: rgba(255,255,255,0.7); margin-bottom: 25px;">Join the SR HUB community</p>
        
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="User Name" required>
            <input type="password" name="password" placeholder="Password (Min 8 characters)" minlength="8" required>
            <button type="submit" class="btn">CREATE ACCOUNT</button>
        </form>
        
        <a href="/login" style="display: block; margin-top: 20px; color: white; text-decoration: none; font-size: 13px;">
            Already have an account? Login
        </a>
    </div>
</body>
</html>
